<!DOCTYPE html>
<html lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Ivan Peter Anich</title>
	
	<link rel="preconnect" href="https://fonts.googleapis.com">
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
	<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>

	<!-- get fonts -->
	<link href="https://fonts.googleapis.com/css2?family=Libertinus+Serif:wght@400;700&family=Jacquard+24&display=block" rel="stylesheet">

	<style>
		:root {
			--content-container-width: 500px;
			--page-top-bottom-padding: 50px;
			--fade-in-duration: 2s;
			--fade-in-delay: 0.5s;
		}
		body {
			min-height: 100vh;
			margin: 0px;
		}
		p {
			font-family: "Libertinus Serif", system-ui;
			font-weight: 400;
			font-style: normal;
		}
		h1 {
			font-family: "Jacquard 24", system-ui;
			font-weight: 400;
			font-style: normal;
			text-align: center;
		}
		.page {
			align-content: center;
			height: calc(100vh - 2 * var(--page-top-bottom-padding));
			padding-top: var(--page-top-bottom-padding);
			padding-bottom: var(--page-top-bottom-padding);
			padding-left: 10vw;
			padding-right: 10vw;
		}
		.animation {
			height: 100vh
		}
		.content-container {
			padding-left: 25px;
			padding-right: 25px;
		}
		.sub-greeting {
			text-align: center;
		}
		.greeting,
		.sub-greeting {
			animation-name: fade-in;
			animation-duration: var(--fade-in-duration);
			animation-timing-function: ease;
			animation-fill-mode: both;
		}
		.greeting {
			animation-delay: var(--fade-in-duration);
		}
		.sub-greeting {
			animation-delay: calc(var(--fade-in-duration) + 2 * var(--fade-in-delay));
		}
		@keyframes fade-in {
			from {
				opacity: 0;
				transform: translateY(-10px);
			}
			to {
				opacity: 1;
			}
		}
		@media (min-width: 768px) {
			.page {
				padding-left: calc(50vw - var(--content-container-width) / 2);
				padding-right: calc(50vw - var(--content-container-width) / 2);
			}
		}
	</style>
</head>
<body>
	<div class="page">
		<div class="content-container">
			<h1 class="greeting">Welcome</h1>
			<p class="sub-greeting">
			Please come in and get to know me.
			</p>
		</div>
	</div>
	<div class="animation"></div>
	<script type="module">
		import * as THREE from "https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.module.js";

		const scene = new THREE.Scene();
		const animationDiv = document.body.querySelector(".animation");
		const camera = new THREE.PerspectiveCamera(75, animationDiv.clientWidth / animationDiv.clientHeight, 0.1, 1000);

		const renderer = new THREE.WebGLRenderer();
		renderer.setSize( animationDiv.clientWidth, animationDiv.clientHeight);
		animationDiv.appendChild( renderer.domElement);

		const geometry = new THREE.BoxGeometry(1, 1, 1);
		const material = new THREE.MeshBasicMaterial( {color: 0x00ff00} );
		const cube = new THREE.Mesh(geometry, material);
		scene.add(cube);

		camera.position.z = 5;

		function animate(time) {
			cube.rotation.x = time / 2000;
			cube.rotation.y = time / 1000;
			renderer.render(scene, camera);
		}
		renderer.setAnimationLoop(animate);
		//add text using CSS3DRenderer?
	</script>
</body>
</html>
